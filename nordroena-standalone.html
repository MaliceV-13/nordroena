<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Norðrœna — progressive path course in historical Old West Norse / Classical normalized Old Norse. Not Modern Icelandic." />
  <title>Norðrœna — Old Norse Path</title>
  <style>
/* Norðrœna — dark scholarly UI (parchment/ink, nordic restraint) */
:root {
  --bg: #0f1210;
  --bg-elev: #171c18;
  --panel: #1c231e;
  --ink: #e8e0d0;
  --ink-dim: #a89f8e;
  --parchment: #c4b59a;
  --accent: #8b9a6d;
  --accent-2: #c9a227;
  --warn: #c47a4a;
  --ok: #6d9a7a;
  --bad: #b85c5c;
  --line: #2a332c;
  --radius: 12px;
  --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cambria Math", "Times New Roman", ui-monospace, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  background:
    radial-gradient(ellipse at top, #1a221c 0%, var(--bg) 55%),
    var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--parchment); }

#app { max-width: 920px; margin: 0 auto; padding: 0 1rem 3rem; }

.site-header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 0.75rem; padding: 1rem 0 1.25rem; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
  background: rgba(15, 18, 16, 0.92); backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 0.65rem; color: inherit; text-decoration: none; }
.brand-mark {
  width: 2.4rem; height: 2.4rem; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(145deg, #2a332c, #121612);
  border: 1px solid var(--accent-2); color: var(--accent-2);
  font-size: 1.25rem;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 1.15rem; letter-spacing: 0.02em; }
.brand-text small { color: var(--ink-dim); font-family: var(--sans); font-size: 0.72rem; }
.nav { display: flex; flex-wrap: wrap; gap: 0.65rem 1rem; font-family: var(--sans); font-size: 0.88rem; }
.nav a { color: var(--ink-dim); text-decoration: none; }
.nav a:hover { color: var(--parchment); }

.main { padding-top: 1.5rem; }
.hero { padding: 1.5rem 0 2rem; }
.eyebrow { font-family: var(--sans); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.72rem; color: var(--accent-2); margin: 0 0 0.5rem; }
.hero h1, .lesson-head h1, .prose h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 600; margin: 0 0 0.75rem; color: var(--parchment); }
.lede { font-size: 1.1rem; color: var(--ink-dim); max-width: 40rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.25rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  font-family: var(--sans); font-size: 0.9rem;
  padding: 0.55rem 1rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--ink);
  cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #3a4a35, #2a3528); border-color: var(--accent); color: #f0ebe0; }
.btn.ghost { background: transparent; }
.btn.small { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
.btn.recording, .btn.record-btn.recording { background: #5a2a2a; border-color: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.75; } }

.panel, .lesson-section, .vocab-card, .review-card, .chrono-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem 1.2rem; margin: 1rem 0;
}
.prose h2, .lesson-section h2, .panel h1, .panel h2 { color: var(--parchment); }
.muted { color: var(--ink-dim); font-size: 0.95rem; }
.scholar-list { padding-left: 1.2rem; }
.scholar-list li { margin: 0.4rem 0; }

.callout {
  border-radius: var(--radius); padding: 0.85rem 1rem; margin: 1rem 0;
  border: 1px solid var(--line); background: var(--bg-elev);
}
.callout.warn { border-color: rgba(196, 122, 74, 0.55); background: #241a14; }
.callout.info { border-color: rgba(139, 154, 109, 0.45); background: #161b16; }
.callout.tight { padding: 0.6rem 0.75rem; font-size: 0.92rem; }
.callout strong { display: block; margin-bottom: 0.35rem; color: var(--warn); }
.callout.info strong { color: var(--accent); }

.label {
  display: inline-block; font-family: var(--sans); font-size: 0.65rem; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 4px;
  border: 1px solid var(--line); vertical-align: middle;
}
.label.attested { color: #b7d4be; border-color: #3d5a45; }
.label.normalized { color: #c9c0a0; border-color: #5a5340; }
.label.reconstructed { color: #c4a0b8; border-color: #5a4050; }
.label.uncertain { color: #c4b0a0; border-color: #5a4a40; }

.letter-grid, .vocab-grid, .rune-grid, .chrono-grid {
  display: grid; gap: 0.75rem;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  margin: 1rem 0;
}
.vocab-grid { grid-template-columns: 1fr; }
@media (min-width: 640px) {
  .vocab-grid { grid-template-columns: 1fr 1fr; }
  .rune-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}
.letter-card, .rune-card {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px;
  padding: 0.75rem; display: flex; flex-direction: column; gap: 0.2rem;
}
.letter-card .glyph, .rune-glyph {
  font-size: 2rem; color: var(--accent-2); font-family: var(--mono); line-height: 1.2;
}
.letter-card .name, .rune-name { font-family: var(--sans); font-size: 0.8rem; color: var(--parchment); }
.letter-card .ipa, .rune-value { font-size: 0.85rem; color: var(--accent); }
.letter-card .note, .rune-note { font-size: 0.78rem; }

.lemma { font-size: 1.45rem; color: var(--accent-2); margin-right: 0.5rem; }
.vocab-card header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-bottom: 0.35rem; }
.grammar { font-size: 0.92rem; }

.tts-box {
  margin-top: 0.75rem; padding: 0.75rem; border-radius: 10px;
  background: #141914; border: 1px dashed var(--line);
}
.tts-disclaimer { font-family: var(--sans); font-size: 0.78rem; color: var(--warn); margin: 0 0 0.6rem; }
.tts-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
.rate-label {
  display: flex; align-items: center; gap: 0.5rem; font-family: var(--sans); font-size: 0.8rem; color: var(--ink-dim);
}
.tts-rate { flex: 1; max-width: 220px; }
.tts-clear-note { font-family: var(--sans); font-size: 0.78rem; margin: 0 0 0.4rem; }
.tts-cue { font-family: var(--sans); font-size: 0.8rem; margin: 0 0 0.5rem; }
.tts-cue code { color: var(--accent-2); font-size: 0.85rem; }
.tts-voice { font-family: var(--sans); font-size: 0.75rem; margin: 0.35rem 0 0; }
.recon-notes { font-size: 0.85rem; color: var(--ink-dim); margin: 0.5rem 0 0; }

.roadmap { list-style: none; padding: 0; margin: 0; }
.roadmap li {
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: center;
  padding: 0.65rem 0; border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 0.92rem;
}
.rm-num {
  font-weight: 600; color: var(--accent-2); min-width: 2rem;
}
.rm-status { color: var(--ink-dim); font-size: 0.75rem; text-transform: uppercase; }

.lesson-list { list-style: none; padding: 0; }
.lesson-list li {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem;
  padding: 0.9rem 0; border-bottom: 1px solid var(--line);
}
.lesson-list li.locked { opacity: 0.7; }
.chip {
  font-family: var(--sans); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 0.15rem 0.4rem; border-radius: 4px; border: 1px solid var(--line); margin-left: 0.35rem; color: var(--ink-dim);
}
.chip.ok { color: var(--ok); border-color: #3d5a45; }
.chip.lock { color: var(--warn); }

.exercises-section h2, .exercises-section h3 { color: var(--parchment); }
.ex-block {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem; margin: 1rem 0; background: var(--bg-elev);
}
.ex-block legend { padding: 0 0.35rem; color: var(--parchment); font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.75rem 0; }
.choice {
  display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.45rem 0.55rem;
  border-radius: 8px; border: 1px solid transparent; font-family: var(--sans); font-size: 0.92rem;
}
.choice:hover { border-color: var(--line); background: var(--panel); }
.text-answer {
  width: 100%; max-width: 28rem; padding: 0.55rem 0.7rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1rem;
  font-family: var(--mono);
}
.ex-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.ex-feedback { margin-top: 0.75rem; padding: 0.65rem 0.75rem; border-radius: 8px; font-family: var(--sans); font-size: 0.9rem; }
.ex-feedback.ok { background: #1a2a20; border: 1px solid #3d5a45; }
.ex-feedback.bad { background: #2a1a1a; border: 1px solid #5a3d3d; }
.ex-feedback .hint { color: var(--ink-dim); }
.progress-line { font-family: var(--sans); font-size: 0.85rem; color: var(--ink-dim); }

.speak-target { margin: 0.35rem 0; }
.mic-panel { margin: 0.75rem 0; padding: 0.75rem; border-radius: 10px; background: #121612; border: 1px solid var(--line); }
.mic-explain { font-family: var(--sans); font-size: 0.82rem; color: var(--ink-dim); }
.mic-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
.self-rate-box { margin-top: 0.75rem; }
.self-rate-box h4 { margin: 0 0 0.5rem; color: var(--parchment); font-size: 0.95rem; }
.check-item { display: flex; gap: 0.45rem; align-items: flex-start; font-family: var(--sans); font-size: 0.88rem; margin: 0.3rem 0; }
.rubric { font-size: 0.85rem; color: var(--ink-dim); }
.playback { width: 100%; margin-top: 0.5rem; }
.asr-out { font-family: var(--sans); font-size: 0.82rem; margin-top: 0.5rem; }

.table-wrap { overflow-x: auto; }
.side-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-family: var(--sans); }
.side-table th, .side-table td { border: 1px solid var(--line); padding: 0.55rem; vertical-align: top; }
.side-table th { background: var(--bg-elev); color: var(--parchment); text-align: left; }

.chrono-grid { grid-template-columns: 1fr; }
@media (min-width: 700px) { .chrono-grid { grid-template-columns: 1fr 1fr; } }

.label-legend { list-style: none; padding: 0; }
.label-legend li { margin: 0.5rem 0; }

.site-footer {
  margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line);
  font-family: var(--sans); font-size: 0.75rem; color: var(--ink-dim); text-align: center;
}
.lesson-foot { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }

code { font-family: var(--mono); color: var(--accent-2); }
details summary { cursor: pointer; color: var(--accent); font-family: var(--sans); }

@media (max-width: 480px) {
  .nav { width: 100%; justify-content: space-between; }
  .btn { width: auto; }
}

/* ——— Path map (scholarly parchment / ink — not Duolingo green) ——— */
.path-header .stat-pills {
  display: flex; gap: 0.5rem; font-family: var(--sans); font-size: 0.8rem;
}
.pill {
  padding: 0.25rem 0.65rem; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg-elev); color: var(--parchment);
}
.pill.streak { border-color: rgba(201, 162, 39, 0.4); }
.pill.xp { border-color: rgba(139, 154, 109, 0.45); }

.path-hero { padding: 1.25rem 0 1.5rem; }
.continue-cta { font-weight: 600; }
.center { text-align: center; }

.path-section {
  margin: 2rem 0; padding: 1.25rem 1rem 1.5rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(180deg, #1a211c 0%, var(--panel) 40%);
}
.path-section.coming-soon { opacity: 0.72; }
.path-section-head h2 { margin: 0.2rem 0; color: var(--parchment); }

.unit-banner {
  display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: baseline;
  font-family: var(--sans); font-size: 0.9rem;
  padding: 0.65rem 0.85rem; margin: 1rem 0 0.75rem;
  border-radius: 10px;
  background: #141914; border: 1px solid rgba(201, 162, 39, 0.35);
  color: var(--ink);
}
.unit-banner strong { color: var(--accent-2); }

.path-track {
  display: flex; flex-direction: column; align-items: center;
  gap: 0; padding: 0.5rem 0 1rem; position: relative;
}

.path-node-wrap {
  display: flex; flex-direction: column; align-items: center;
  width: 100%; max-width: 320px; position: relative;
}
.path-node-wrap.left { align-items: flex-start; padding-left: 8%; }
.path-node-wrap.right { align-items: flex-end; padding-right: 8%; }

.path-connector {
  width: 3px; height: 1.1rem;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  opacity: 0.55; border-radius: 2px;
  margin: 0 auto;
}
.path-node-wrap.left .path-connector,
.path-node-wrap.right .path-connector { margin-left: 2.1rem; margin-right: 2.1rem; }

.path-node {
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
  gap: 0.1rem 0.65rem; align-items: center;
  min-width: 11rem; max-width: 16rem;
  padding: 0.65rem 0.85rem 0.65rem 0.65rem;
  border-radius: 999px 16px 16px 999px;
  text-decoration: none; color: inherit;
  background: var(--bg-elev);
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 #0a0c0a;
  transition: transform 0.12s ease, border-color 0.12s;
  font-family: var(--sans);
  position: relative;
}
.path-node:hover:not(.locked) {
  transform: translateY(-2px);
  border-color: var(--accent-2);
}
.path-node .node-icon {
  grid-row: 1 / span 2;
  width: 2.6rem; height: 2.6rem; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 1.15rem; font-family: var(--mono);
  background: #121612; border: 1px solid var(--accent);
  color: var(--accent-2);
}
.path-node .node-type {
  font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim);
}
.path-node .node-title { font-size: 0.88rem; color: var(--parchment); font-weight: 600; }
.path-node .node-check {
  position: absolute; top: -0.35rem; right: -0.2rem;
  background: var(--ok); color: #0f1210; font-size: 0.7rem;
  width: 1.2rem; height: 1.2rem; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700;
}
.path-node .node-cta {
  grid-column: 2; font-size: 0.7rem; color: var(--accent-2);
}
.path-node.current {
  border-color: var(--accent-2);
  box-shadow: 0 4px 0 #3a3010, 0 0 0 3px rgba(201, 162, 39, 0.2);
}
.path-node.done {
  border-color: #3d5a45;
  background: #1a2420;
}
.path-node.done .node-icon { border-color: var(--ok); color: var(--ok); }
.path-node.locked {
  opacity: 0.45; cursor: not-allowed;
  box-shadow: none;
}
.path-node.type-checkpoint .node-icon { border-color: var(--accent-2); }
.path-node.type-lore .node-icon { border-color: var(--parchment); }
.path-node.type-speak .node-icon { border-color: #7a8ab0; color: #a8b4d0; }
.path-node.type-listen .node-icon { border-color: #8a7a9a; color: #c4b0d4; }
.path-node.type-practice .node-icon { border-color: var(--accent); }

.side-paths { margin: 2rem 0; }
.side-path-card {
  display: flex; gap: 1rem; align-items: flex-start;
  padding: 1rem 1.1rem; border-radius: var(--radius);
  border: 1px dashed var(--accent-2); background: #161410;
  text-decoration: none; color: inherit;
}
.side-path-card:hover { border-style: solid; }
.side-glyph {
  font-size: 2rem; color: var(--accent-2); line-height: 1;
}
.side-path-card .small { font-size: 0.8rem; }

/* ——— Session UI ——— */
.session-main { max-width: 560px; margin: 0 auto; }
.session-view { display: flex; flex-direction: column; min-height: 70vh; }
.sess-top {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0 1rem; position: sticky; top: 0;
  background: rgba(15, 18, 16, 0.95); z-index: 5;
}
.sess-bar {
  flex: 1; height: 10px; border-radius: 999px;
  background: var(--line); overflow: hidden;
}
.sess-bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transition: width 0.25s ease;
}
.sess-hearts {
  font-size: 0.95rem; letter-spacing: 0.05em; color: var(--bad);
  min-width: 5.5rem; text-align: right; font-family: var(--sans);
}
.sess-body { flex: 1; padding: 0.5rem 0 1rem; }
.sess-prompt {
  font-size: 1.15rem; color: var(--parchment); margin: 0 0 1rem; line-height: 1.4;
}
.intro-card h1 { font-size: 1.6rem; color: var(--parchment); }
.intro-html { margin: 1rem 0 1.5rem; }

.choices.big { display: flex; flex-direction: column; gap: 0.55rem; }
.choice-btn, .tile-btn {
  font-family: var(--sans); font-size: 1rem;
  padding: 0.85rem 1rem; border-radius: 12px;
  border: 2px solid var(--line); background: var(--bg-elev); color: var(--ink);
  cursor: pointer; text-align: left;
}
.choice-btn:hover, .tile-btn:hover { border-color: var(--accent); }
.choice-btn.selected, .tile-btn.selected {
  border-color: var(--accent-2);
  background: #242018;
  box-shadow: 0 0 0 1px var(--accent-2);
}

.tile-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
.tile-answer {
  min-height: 2.5rem; padding: 0.65rem 0.85rem;
  border: 1px dashed var(--line); border-radius: 10px;
  font-family: var(--mono); font-size: 1.15rem; color: var(--accent-2);
}

.match-grid { display: flex; flex-direction: column; gap: 0.65rem; }
.match-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; align-items: center;
}
.match-left {
  font-family: var(--mono); color: var(--accent-2); font-size: 1.05rem;
}
.match-select {
  padding: 0.5rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-family: var(--sans);
}

.sess-feedback {
  margin: 0.5rem 0; padding: 0.75rem 0.9rem; border-radius: 10px;
  font-family: var(--sans); font-size: 0.92rem;
}
.sess-feedback.ok { background: #1a2a20; border: 1px solid #3d5a45; }
.sess-feedback.bad { background: #2a1a1a; border: 1px solid #5a3d3d; }

.sess-footer {
  position: sticky; bottom: 0; padding: 0.75rem 0 1rem;
  background: linear-gradient(transparent, var(--bg) 30%);
}
.sess-footer .btn { width: 100%; padding: 0.85rem; font-size: 1rem; }

.tts-box.compact { margin-bottom: 1rem; }
.on-quote {
  font-size: 1.4rem; color: var(--accent-2); font-family: var(--mono);
  border-left: 3px solid var(--accent-2); padding-left: 1rem; margin: 1rem 0;
}
.lore-text, .lore-body { font-size: 1.05rem; }

.celebrate {
  text-align: center; padding: 2.5rem 1rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: radial-gradient(ellipse at center, #2a3320 0%, var(--panel) 70%);
}
.celebrate.failed {
  background: radial-gradient(ellipse at center, #332020 0%, var(--panel) 70%);
}
.celebrate h1 { color: var(--accent-2); }
.celebrate .hero-actions { justify-content: center; }

@media (max-width: 480px) {
  .path-node-wrap.left { padding-left: 4%; }
  .path-node-wrap.right { padding-right: 4%; }
  .stat-pills { order: 3; width: 100%; }
}

/**
 * Norðrœna — path progress (XP, streak, completed levels)
 * localStorage key v2 for Duolingo-style path.
 */
(function (global) {
  const KEY = "nordrona_progress_v2";
  const LEGACY = "nordrona_progress_v1";

  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function yesterdayKey() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function defaultState() {
    return {
      version: 2,
      completedLevels: {},
      currentLevelId: null,
      xp: 0,
      streak: 0,
      lastActiveDay: null,
      reviewQueue: [],
      voiceRecordings: {},
      hearts: 5,
      lastUpdated: null
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        return Object.assign(defaultState(), JSON.parse(raw));
      }
    } catch (e) {}
    return defaultState();
  }

  function save(state) {
    state.lastUpdated = new Date().toISOString();
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
    return state;
  }

  function touchStreak() {
    const s = load();
    const today = todayKey();
    if (s.lastActiveDay === today) {
      return s;
    }
    if (s.lastActiveDay === yesterdayKey()) {
      s.streak = (s.streak || 0) + 1;
    } else if (!s.lastActiveDay) {
      s.streak = 1;
    } else {
      s.streak = 1;
    }
    s.lastActiveDay = today;
    return save(s);
  }

  function isLevelComplete(levelId) {
    const s = load();
    return !!(s.completedLevels && s.completedLevels[levelId]);
  }

  function getCompletedSet() {
    return load().completedLevels || {};
  }

  function getLinearIds() {
    const path = global.NORDRONA && global.NORDRONA.path;
    if (!path || !path.getLinearPlayable) return [];
    return path.getLinearPlayable().map((x) => x.level.id);
  }

  function isLevelUnlocked(levelId) {
    const found = global.NORDRONA.path.findLevel(levelId);
    // Study-notes / classic lesson nodes: available whenever the section is playable
    if (found && (found.level.notesOnly || found.level.type === "notes")) {
      if (found.level.lockedShell || found.section.comingSoon || !found.section.unlocked) return false;
      return true;
    }
    const ids = getLinearIds();
    const idx = ids.indexOf(levelId);
    if (idx === -1) {
      if (!found) return false;
      if (found.level.lockedShell || found.section.comingSoon) return false;
      return false;
    }
    if (idx === 0) return true;
    for (let i = 0; i < idx; i++) {
      if (!isLevelComplete(ids[i])) return false;
    }
    return true;
  }

  function getContinueLevelId() {
    const ids = getLinearIds();
    for (let i = 0; i < ids.length; i++) {
      if (!isLevelComplete(ids[i])) return ids[i];
    }
    return ids.length ? ids[ids.length - 1] : null;
  }

  function completeLevel(levelId, opts) {
    opts = opts || {};
    const s = touchStreak();
    s.completedLevels[levelId] = {
      at: new Date().toISOString(),
      perfect: !!opts.perfect,
      mistakes: opts.mistakes || 0
    };
    const path = global.NORDRONA.path;
    const base = (path && path.xpPerLevel) || 10;
    const bonus = opts.perfect ? (path && path.xpPerPerfect) || 15 : base;
    s.xp = (s.xp || 0) + (opts.perfect ? bonus : base);
    save(s);
    s.currentLevelId = getContinueLevelId();
    return save(s);
  }

  function getStats() {
    const s = load();
    // refresh streak break if missed a day
    const today = todayKey();
    let streak = s.streak || 0;
    if (s.lastActiveDay && s.lastActiveDay !== today && s.lastActiveDay !== yesterdayKey()) {
      streak = 0;
    }
    return {
      xp: s.xp || 0,
      streak,
      completedCount: Object.keys(s.completedLevels || {}).length,
      currentLevelId: s.currentLevelId || getContinueLevelId(),
      heartsMax: (global.NORDRONA.path && global.NORDRONA.path.heartsMax) || 5
    };
  }

  function addToReview(item) {
    const s = load();
    if (!s.reviewQueue.some((q) => q.id === item.id)) {
      s.reviewQueue.push({
        id: item.id,
        levelId: item.levelId,
        prompt: item.prompt,
        answer: item.answer,
        explanation: item.explanation || "",
        addedAt: new Date().toISOString()
      });
      save(s);
    }
    return s.reviewQueue;
  }

  function getReviewQueue() {
    return load().reviewQueue || [];
  }

  function removeFromReview(id) {
    const s = load();
    s.reviewQueue = (s.reviewQueue || []).filter((q) => q.id !== id);
    save(s);
    return s.reviewQueue;
  }

  function markVoice(exerciseId, payload) {
    const s = load();
    s.voiceRecordings[exerciseId] = {
      savedAt: new Date().toISOString(),
      selfRatings: payload.selfRatings || {},
      hadRecording: !!payload.hadRecording,
      checklistSubmitted: !!payload.checklistSubmitted
    };
    return save(s);
  }

  function resetAll() {
    try {
      localStorage.removeItem(KEY);
      localStorage.removeItem(LEGACY);
    } catch (e) {}
    return defaultState();
  }

  // Legacy stubs so old review/app bits don't crash
  function isLessonComplete() { return false; }
  function isLessonUnlocked(id) { return id === 1; }
  function lessonState() {
    return { writtenComplete: false, voiceComplete: false, writtenAnswers: {}, voiceDone: {} };
  }

  global.NORDRONA = global.NORDRONA || {};
  global.NORDRONA.progress = {
    load,
    save,
    touchStreak,
    isLevelComplete,
    isLevelUnlocked,
    getContinueLevelId,
    completeLevel,
    getStats,
    getCompletedSet,
    addToReview,
    getReviewQueue,
    removeFromReview,
    markVoice,
    resetAll,
    // legacy
    isLessonComplete,
    isLessonUnlocked,
    lessonState,
    KEY
  };
})(window);

/**
 * Norðrœna — exercise grading for path session types
 */
(function (global) {
  function normalizeAnswer(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .normalize("NFC")
      .replace(/\s+/g, " ");
  }

  function gradeWritten(exercise, userInput) {
    const type = exercise.type;

    if (
      type === "multiple" ||
      type === "matching-note" ||
      type === "truefalse" ||
      type === "tap_hear" ||
      type === "listen_choice" ||
      type === "translate_on_en" ||
      type === "fill"
    ) {
      if (type === "fill" && exercise.accept && !exercise.choices) {
        const norm = normalizeAnswer(userInput);
        const accept = (exercise.accept || []).map(normalizeAnswer);
        const correct = accept.indexOf(norm) !== -1;
        return {
          correct,
          expected: exercise.accept[0],
          explanation: exercise.explanation || "",
          hint: exercise.hint || ""
        };
      }
      // fill with choices, or MC-like: userInput is choice id
      if (type === "fill" && exercise.choices && exercise.accept) {
        // user may send choice id or typed text
        const byId = (exercise.choices || []).find((c) => c.id === userInput);
        const textVal = byId ? byId.text : userInput;
        const norm = normalizeAnswer(textVal);
        const accept = (exercise.accept || []).map(normalizeAnswer);
        const correct =
          accept.indexOf(norm) !== -1 ||
          (exercise.answer && userInput === exercise.answer);
        // also allow matching choice whose text is accept
        let ok = correct;
        if (!ok && byId) ok = accept.indexOf(normalizeAnswer(byId.text)) !== -1;
        return {
          correct: ok,
          expected: exercise.accept[0],
          explanation: exercise.explanation || "",
          hint: exercise.hint || ""

/**
 * Norðrœna — path session runner
 * One exercise at a time · progress bar · check · hearts · celebration
 */
(function (global) {
  const N = () => global.NORDRONA;

  let session = null;

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function labelClass(label) {
    const L = String(label || "").toUpperCase();
    if (L === "ATTESTED") return "attested";
    if (L === "NORMALIZED") return "normalized";
    if (L === "RECONSTRUCTED") return "reconstructed";
    return "uncertain";
  }

  function start(levelId) {
    const found = N().path.findLevel(levelId);
    if (!found || !found.level.exercises || !found.level.exercises.length) {
      return { ok: false, reason: "missing" };
    }
    if (!N().progress.isLevelUnlocked(levelId)) {
      return { ok: false, reason: "locked" };
    }
    const heartsMax = N().path.heartsMax || 5;
    session = {
      levelId,
      level: found.level,
      unit: found.unit,
      section: found.section,
      exercises: found.level.exercises.slice(),
      index: 0,
      hearts: heartsMax,
      heartsMax,
      mistakes: 0,
      checked: false,
      lastCorrect: null,
      finished: false,
      skipIntro: false
    };
    N().progress.touchStreak();
    return { ok: true, session };
  }

  function getSession() {
    return session;
  }

  function currentExercise() {
    if (!session || session.finished) return null;
    // optional intro card as index -1 conceptually: handled by app via intro flag
    return session.exercises[session.index] || null;
  }

  function progressFraction() {
    if (!session) return 0;
    return session.exercises.length
      ? session.index / session.exercises.length
      : 0;
  }

  function ttsMini(form, clearSpeak) {
    const T = N().tts;
    if (!T || !T.available()) {
      return `<p class="muted">TTS unavailable — use clear cue: <code>${escapeHtml(clearSpeak || form)}</code></p>`;
    }
    const clear = clearSpeak || (T.buildClearCue && T.buildClearCue(form)) || form;
    return `
      <div class="tts-box compact" data-speak-text="${escapeHtml(form)}" data-speak-clear="${escapeHtml(clear)}">
        ${T.DISCLAIMER_HTML || '<p class="tts-disclaimer">MODERN APPROXIMATION — NOT historical Old Norse speech</p>'}
        <p class="tts-cue muted"><strong>Clear cue:</strong> <code>${escapeHtml(clear)}</code></p>
        <div class="tts-actions">
          <button type="button" class="btn play tts-play-clear">▶ Play clear</button>
          <button type="button" class="btn ghost tts-slow">Play slow</button>
          <button type="button" class="btn ghost tts-ortho">Orthography</button>
          <button type="button" class="btn ghost tts-stop">Stop</button>
        </div>
      </div>`;
  }

  function renderExerciseHtml(ex) {
    if (!ex) return "";
    const type = ex.type;

    if (type === "lore") {
      return `
        <div class="sess-ex" data-type="lore">
          <h2>${escapeHtml(ex.title || "Reading")}</h2>
          <div class="lore-body">${ex.html || ""}</div>
          <p class="muted">Tap Continue when you have read this.</p>
        </div>`;
    }

    if (type === "speak") {
      const cues = (ex.historicalCues || [])
        .map(
          (c, i) =>
            `<label class="check-item"><input type="checkbox" class="self-rate" data-cue="${i}" /><span>${escapeHtml(c)}</span></label>`
        )
        .join("");

      return `
        <div class="sess-ex speak-block" data-type="speak" data-ex="${escapeHtml(ex.id)}">
          <p class="sess-prompt">${ex.prompt || "Say:"}</p>
          <p class="speak-target"><span class="lemma">${escapeHtml(ex.target)}</span>
            <span class="label ${labelClass(ex.label)}">${escapeHtml(ex.label || "NORMALIZED")}</span></p>
          <p class="gloss">${escapeHtml(ex.gloss || "")}</p>
          ${ex.clearSpeak ? `<p class="tts-cue muted"><strong>Clear speak:</strong> <code>${escapeHtml(ex.clearSpeak)}</code></p>` : ""}
          ${ex.reconstructedNotes ? `<div class="recon-notes callout info"><strong>Reconstructed notes</strong><p>${escapeHtml(ex.reconstructedNotes)}</p></div>` : ""}
          ${ttsMini(ex.target, ex.clearSpeak)}
          <div class="mic-panel" data-ex="${escapeHtml(ex.id)}">
            <p class="mic-explain">Record → playback → self-rate. Nothing is uploaded. ASR is never historical ground truth.</p>
            <div class="mic-status muted" data-role="status">Mic: not requested yet</div>
            <div class="mic-actions">
              <button type="button" class="btn primary mic-enable">Enable microphone</button>
              <button type="button" class="btn record-btn" disabled>Record</button>
              <button type="button" class="btn ghost playback-btn" disabled>Play my recording</button>
            </div>
            <div class="mic-denied callout warn" hidden>
              <strong>Microphone permission denied</strong>
              <p>Allow mic for this site, prefer localhost/HTTPS.</p>
            </div>
            <audio class="playback" controls hidden></audio>
          </div>
          <div class="self-rate-box">
            <h4>Self-rate</h4>
            ${cues}
            <ul class="rubric">${tips}</ul>
          </div>
        </div>`;
    }

    if (type === "tap_hear" || type === "listen_choice") {
      return `
        <div class="sess-ex" data-type="${type}">
          <p class="sess-prompt">${ex.prompt || "Tap what you hear"}</p>
          ${ttsMini(ex.audioForm, ex.clearSpeak)}
          <div class="choices big">
            ${(ex.choices || [])
              .map(
                (c) =>
                  `<button type="button" class="choice-btn" data-val="${escapeHtml(c.id)}">${c.text}</button>`
              )
              .join("")}
          </div>
        </div>`;
    }

    if (type === "multiple" || type === "truefalse" || type === "translate_on_en" || type === "matching-note") {
      return `
        <div class="sess-ex" data-type="${type}">
          <p class="sess-prompt">${ex.prompt}</p>
          <div class="choices big">
            ${(ex.choices || [])
              .map(
                (c) =>
                  `<button type="button" class="choice-btn" data-val="${escapeHtml(c.id)}">${c.text}</button>`
              )
              .join("")}
          </div>
        </div>`;
    }

    if (type === "text" || (type === "fill" && !ex.choices)) {
      return `
        <div class="sess-ex" data-type="${type}">
          <p class="sess-prompt">${ex.prompt}</p>
          <input type="text" class="text-answer sess-text" autocomplete="off" spellcheck="false" placeholder="Type answer…" />
        </div>`;
    }

    if (type === "fill" && ex.choices) {
      return `
        <div class="sess-ex" data-type="fill">
          <p class="sess-prompt">${ex.prompt}</p>
          <div class="choices big">
            ${(ex.choices || [])
              .map(
                (c) =>
                  `<button type="button" class="choice-btn" data-val="${escapeHtml(c.id)}" data-text="${escapeHtml(c.text)}">${c.text}</button>`
              )
              .join("")}
          </div>
        </div>`;
    }

    if (type === "tiles") {
      return `
        <div class="sess-ex" data-type="tiles">
          <p class="sess-prompt">${escapeHtml(ex.prompt)}</p>
          <div class="tile-answer muted" data-role="tile-out">(tap a tile)</div>
          <div class="tile-bank">
            ${(ex.tiles || [])
              .map(
                (t) =>
                  `<button type="button" class="tile-btn" data-val="${escapeHtml(t)}">${escapeHtml(t)}</button>`
              )
              .join("")}
          </div>
        </div>`;
    }

    if (type === "match") {
      const rights = (ex.pairs || []).map((p) => p.right);
      // shuffle copy
      const shuffled = rights.slice().sort(() => Math.random() - 0.5);
      return `
        <div class="sess-ex" data-type="match">
          <p class="sess-prompt">${escapeHtml(ex.prompt || "Match pairs")}</p>
          <div class="match-grid">
            ${(ex.pairs || [])
              .map(
                (p, i) => `
              <div class="match-row" data-left="${escapeHtml(p.left)}">
                <span class="match-left">${escapeHtml(p.left)}</span>
                <select class="match-select">
                  <option value="">—</option>
                  ${shuffled
                    .map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`)
                    .join("")}
                </select>
              </div>`
              )
              .join("")}
          </div>
        </div>`;
    }

    return `<div class="sess-ex"><p>Unsupported type: ${escapeHtml(type)}</p></div>`;
  }

  function collectAnswer(root, ex) {
    if (!ex) return null;
    const type = ex.type;
    if (type === "lore" || type === "speak") return "__continue__";
    if (type === "tiles") {
      const out = root.querySelector("[data-role='tile-out']");
      const v = out && out.getAttribute("data-val");
      return v || "";
    }
    if (type === "match") {
      const map = {};
      root.querySelectorAll(".match-row").forEach((row) => {
        const left = row.getAttribute("data-left");
        const sel = row.querySelector("select");
        map[left] = sel ? sel.value : "";
      });
      return map;
    }
    if (type === "text" || (type === "fill" && !ex.choices)) {
      const inp = root.querySelector(".sess-text");
      return inp ? inp.value : "";
    }
    const selected = root.querySelector(".choice-btn.selected");
    if (!selected) return null;
    if (type === "fill" && ex.choices) {
      return selected.getAttribute("data-val");
    }
    return selected.getAttribute("data-val");
  }

  function check(root) {
    if (!session || session.finished) return { ok: false };
    const ex = currentExercise();
    if (!ex) return { ok: false };

    if (ex.type === "lore") {
      session.checked = true;
      session.lastCorrect = true;
      return { ok: true, correct: true, explanation: "", auto: true };
    }

    if (ex.type === "speak") {
      // require at least one self-rate OR allow continue after viewing
      const checks = root.querySelectorAll(".self-rate:checked");
      const had = checks.length > 0;
      N().progress.markVoice(ex.id, {
        selfRatings: {},
        hadRecording: !!(N().voice && N().voice.getLastUrl && N().voice.getLastUrl()),
        checklistSubmitted: had || true
      });
      session.checked = true;
      session.lastCorrect = true;
      return { ok: true, correct: true, explanation: "Self-rate saved. Continue.", speak: true };
    }

    const answer = collectAnswer(root, ex);
    if (answer == null || answer === "") {
      return { ok: false, reason: "empty" };
    }

    const result = N().exercises.gradeWritten(ex, answer);
    session.checked = true;
    session.lastCorrect = !!result.correct;

    if (!result.correct) {
      session.mistakes += 1;
      session.hearts = Math.max(0, session.hearts - 1);
      N().progress.addToReview({
        id: ex.id,
        levelId: session.levelId,
        prompt: ex.prompt,
        answer: result.expected,
        explanation: result.explanation
      });
    }

    return {
      ok: true,
      correct: result.correct,
      explanation: result.explanation,
      hint: result.hint,
      expected: result.expected,
      hearts: session.hearts,
      dead: session.hearts <= 0
    };
  }

  function advance() {
    if (!session) return { done: true };
    if (session.hearts <= 0) {
      session.finished = true;
      return { done: true, failed: true, mistakes: session.mistakes };
    }
    session.index += 1;
    session.checked = false;
    session.lastCorrect = null;
    if (session.index >= session.exercises.length) {
      session.finished = true;
      const perfect = session.mistakes === 0;
      N().progress.completeLevel(session.levelId, {
        perfect,
        mistakes: session.mistakes
      });
      return {
        done: true,
        perfect,
        mistakes: session.mistakes,
        xp: perfect ? N().path.xpPerPerfect || 15 : N().path.xpPerLevel || 10,
        nextId: N().progress.getContinueLevelId()
      };
    }
    return { done: false, index: session.index };
  }

  function abandon() {
    session = null;
  }

  function renderShell(showIntro) {
    if (!session) return "";
    const lv = session.level;
    const frac = progressFraction();
    const pct = Math.round(frac * 100);
    const hearts = "♥".repeat(session.hearts) + "♡".repeat(Math.max(0, session.heartsMax - session.hearts));

    if (showIntro && lv.intro && session.index === 0 && !session.skipIntro && !session._introDone) {
      return `
        <div class="session-view">
          <div class="sess-top">
            <button type="button" class="btn ghost sess-quit" title="Quit">✕</button>
            <div class="sess-bar"><div class="sess-bar-fill" style="width:${pct}%"></div></div>
            <div class="sess-hearts" title="Mistake budget">${hearts}</div>
          </div>
          <div class="sess-body intro-card">
            <p class="eyebrow">${escapeHtml(lv.type)} · ${escapeHtml(session.unit.title)}</p>
            <h1>${escapeHtml(lv.intro.title || lv.title)}</h1>
            <div class="intro-html">${lv.intro.html || ""}</div>
            <button type="button" class="btn primary sess-start-ex">Start exercises</button>
          </div>
        </div>`;
    }

    if (session.finished) {
      return ""; // app shows celebration
    }

    const ex = currentExercise();
    return `
      <div class="session-view">
        <div class="sess-top">
          <button type="button" class="btn ghost sess-quit" title="Quit">✕</button>
          <div class="sess-bar"><div class="sess-bar-fill" style="width:${pct}%"></div></div>
          <div class="sess-hearts" title="Mistake budget">${hearts}</div>
        </div>
        <div class="sess-body" id="sess-exercise">
          ${renderExerciseHtml(ex)}
        </div>
        <div class="sess-feedback" id="sess-feedback" hidden></div>
        <div class="sess-footer">
          <button type="button" class="btn primary sess-check" id="sess-check">Check</button>
          <button type="button" class="btn primary sess-continue" id="sess-continue" hidden>Continue</button>
        </div>
      </div>`;
  }

  function markIntroDone() {
    if (session) session._introDone = true;
  }

  global.NORDRONA = global.NORDRONA || {};
  global.NORDRONA.session = {
    start,
    getSession,
    currentExercise,
    progressFraction,
    renderShell,
    renderExerciseHtml,
    collectAnswer,
    check,
    advance,
    abandon,
    markIntroDone,
    ttsMini,
    escapeHtml,
    labelClass
  };
})(window);

              ${li > 0 ? '<div class="path-connector" aria-hidden="true"></div>' : ""}
              <a class="${cls}" href="${href}" data-level="${escapeHtml(lv.id)}"
                 title="${escapeHtml(label)}" ${!unlocked || lv.lockedShell ? 'aria-disabled="true"' : ""}>
                <span class="node-icon">${lv.icon && lv.icon.length <= 2 ? escapeHtml(lv.icon) : typeIcon(lv.type)}</span>
                <span class="node-type">${escapeHtml(lv.type)}</span>
                <span class="node-title">${escapeHtml(label)}</span>
                ${done ? '<span class="node-check">✓</span>' : ""}
                ${isCurrent && unlocked ? '<span class="node-cta">Start</span>' : ""}
              </a>
            </div>`;
        });

        pathHtml += `</div></div>`;
      });

      pathHtml += `</section>`;
    });

    // Side path
    const side = (path.sidePaths || [])
      .map(
        (sp) => `
      <a class="side-path-card" href="${escapeHtml(sp.route)}">
        <span class="side-glyph">ᚦ</span>
        <div>
          <strong>${escapeHtml(sp.title)}</strong>
          <p class="muted">${escapeHtml(sp.subtitle)}</p>
          <p class="muted small">${escapeHtml(sp.note || "")}</p>
        </div>
      </a>`
      )
      .join("");

    return `
      <section class="path-home">
        <div class="path-hero">
          <p class="eyebrow">Historical Old West Norse</p>
          <h1>${escapeHtml(path.title)}</h1>
          <p class="lede">A winding path through Classical <em>normalized</em> Old Norse — sounds, first words, and philological honesty. Not Modern Icelandic. Not a green-owl clone.</p>
          <div class="hero-actions">
            ${
              continueFound
                ? `<a class="btn primary continue-cta" href="#/session/${escapeHtml(continueId)}">Continue · ${escapeHtml(continueFound.level.title)}</a>`
                : `<span class="btn primary" disabled>Path complete (Section 1)</span>`
            }
            <a class="btn ghost" href="#/charter">Charter</a>
            <a class="btn ghost" href="#/lesson/1">Classic Lesson 1</a>
          </div>
          <p class="progress-line">✦ ${stats.xp} XP · 🔥 ${stats.streak}-day streak · ${stats.completedCount} levels done</p>
        </div>
        ${pathHtml}
        <section class="side-paths">
          <h2>Side paths &amp; full notes</h2>
          ${side}
        </section>
        <p class="center"><button type="button" class="btn ghost" id="reset-progress">Reset all progress</button></p>
      </section>`;
  }


  function labelClassHtml(label) {
    return `<span class="label ${labelClass(label)}">${escapeHtml(label)}</span>`;
  }

  function renderVocabCard(v) {
    if (!v) return "";
    const compare = v.compare
      ? `<aside class="callout warn tight"><strong>${escapeHtml(v.compare.label)}</strong><p>${escapeHtml(v.compare.text)}</p></aside>`
      : "";
    const tts =
      NORDRONA.session && NORDRONA.session.ttsMini
        ? NORDRONA.session.ttsMini(v.form, v.clearSpeak)
        : v.clearSpeak
          ? `<p class="tts-cue muted"><strong>Clear cue:</strong> <code>${escapeHtml(v.clearSpeak)}</code></p>`
          : "";
    return `
      <article class="vocab-card">
        <header>
          <span class="lemma">${escapeHtml(v.form)}</span>
          ${labelClassHtml(v.label || "ATTESTED")}
        </header>
        <p class="gloss">${escapeHtml(v.gloss || "")}</p>
        <p class="pos muted">${escapeHtml(v.pos || "")}</p>
        ${v.labelNote ? `<p class="label-note muted"><em>Label note:</em> ${escapeHtml(v.labelNote)}</p>` : ""}
        ${v.grammar ? `<p class="grammar">${escapeHtml(v.grammar)}</p>` : ""}
        ${tts}
        ${compare}
      </article>`;
  }

  function renderLessonSections(lesson, sectionIds) {
    if (!lesson || !lesson.sections) return "<p>No sections.</p>";
    const wanted = sectionIds && sectionIds.length ? new Set(sectionIds) : null;
    return lesson.sections
      .filter((s) => !wanted || wanted.has(s.id))
      .map((sec) => {
        let body = sec.html || "";
        let vocab = "";
        if (sec.vocab && sec.vocab.length) {
          vocab = `<div class="vocab-grid">${sec.vocab.map(renderVocabCard).join("")}</div>`;
        }
        return `
          <section class="lesson-section" id="sec-${escapeHtml(sec.id)}">
            <h2>${escapeHtml(sec.title)}</h2>
            <div class="section-html">${body}</div>
            ${vocab}
          </section>`;
      })
      .join("");
  }

  function renderClassicExercises(lesson) {
    const written = (lesson.exercises || []).filter((e) => e.type !== "speak");
    const speak = (lesson.exercises || []).filter((e) => e.type === "speak");
    const S = NORDRONA.session;
    let html = "";
    if (written.length) {
      html += `<section class="exercises-section panel"><h2>Written exercises (Lesson 1)</h2>`;
      written.forEach((ex) => {
        if (ex.type === "multiple" || ex.type === "matching-note") {
          html += `
            <fieldset class="ex-block" data-ex="${escapeHtml(ex.id)}">
              <legend>${ex.prompt}</legend>
              <div class="choices">
                ${(ex.choices || [])
                  .map(
                    (c) =>
                      `<label class="choice"><input type="radio" name="${escapeHtml(ex.id)}" value="${escapeHtml(c.id)}" /><span>${c.text}</span></label>`
                  )
                  .join("")}
              </div>
              <div class="ex-actions"><button type="button" class="btn primary classic-check" data-ex="${escapeHtml(ex.id)}">Check</button></div>
              <div class="ex-feedback" hidden></div>

        } else if (ex.type === "text") {
          html += `
            <fieldset class="ex-block" data-ex="${escapeHtml(ex.id)}">
              <legend>${ex.prompt}</legend>
              <input type="text" class="text-answer classic-text" data-ex="${escapeHtml(ex.id)}" autocomplete="off" spellcheck="false" />
              <div class="ex-actions"><button type="button" class="btn primary classic-check" data-ex="${escapeHtml(ex.id)}">Check</button></div>
              <div class="ex-feedback" hidden></div>
            </fieldset>`;
        }
      });
      html += `</section>`;
    }
    if (speak.length) {
      html += `<section class="exercises-section panel"><h2>Speak drills (Lesson 1)</h2>
        <p class="muted">Full clearSpeak + reconstructedNotes from lesson1.js. Mic + self-rate; TTS clear / slow / orthography.</p>`;
      speak.forEach((ex) => {
        const cues = (ex.historicalCues || [])
          .map((c) => `<label class="check-item"><input type="checkbox" /><span>${escapeHtml(c)}</span></label>`)
          .join("");
        const tips = (ex.rubricTips || []).map((x) => `<li>${escapeHtml(x)}</li>`).join("");
        html += `
          <div class="speak-block panel" data-ex="${escapeHtml(ex.id)}">
            <p class="sess-prompt">${ex.prompt || "Say:"}</p>
            <p class="speak-target"><span class="lemma">${escapeHtml(ex.target)}</span> ${labelClassHtml(ex.label || "NORMALIZED")}</p>
            <p class="gloss">${escapeHtml(ex.gloss || "")}</p>
            ${ex.clearSpeak ? `<p class="tts-cue muted"><strong>Clear speak:</strong> <code>${escapeHtml(ex.clearSpeak)}</code></p>` : ""}
            ${ex.reconstructedNotes ? `<div class="recon-notes callout info"><strong>Reconstructed notes</strong><p>${escapeHtml(ex.reconstructedNotes)}</p></div>` : ""}
            ${S && S.ttsMini ? S.ttsMini(ex.target, ex.clearSpeak) : ""}
            <div class="mic-panel" data-ex="${escapeHtml(ex.id)}">
              <p class="mic-explain">Record → playback → self-rate. Nothing is uploaded. ASR is never historical ground truth.</p>
              <div class="mic-status muted" data-role="status">Mic: not requested yet</div>
              <div class="mic-actions">
                <button type="button" class="btn primary mic-enable">Enable microphone</button>
                <button type="button" class="btn record-btn" disabled>Record</button>
                <button type="button" class="btn ghost playback-btn" disabled>Play my recording</button>
              </div>
              <div class="mic-denied callout warn" hidden>
                <strong>Microphone permission denied</strong>
                <p>Allow mic for this site, prefer localhost/HTTPS.</p>
              </div>
              <audio class="playback" controls hidden></audio>
            </div>
            <div class="self-rate-box">
              <h4>Self-rate</h4>
              ${cues}
              <ul class="rubric">${tips}</ul>
            </div>
          </div>`;
      });
      html += `</section>`;
    }
    return html;

    return `
      <div class="celebrate failed">

          <a class="btn primary" href="#/session/${escapeHtml(state.levelId)}">Retry level</a>

        </div>
      </div>`;

  function renderSession() {
    const S = NORDRONA.session;
    if (state.celebrate) return renderCelebrate(state.celebrate);
    if (state.failed) return renderFailed();

    if (!state.sessionActive) {
      const res = S.start(state.levelId);
      if (!res.ok) {
        return `
          <section class="panel">
            <h1>${res.reason === "locked" ? "Level locked" : "Level unavailable"}</h1>
            <p>Complete earlier nodes on the path first, or this shell is coming soon.</p>
            <a class="btn" href="#/home">Back to path</a>
          </section>`;
      }
      state.sessionActive = true;
      state.showIntro = true;
    }
    return S.renderShell(state.showIntro);
  }

  function render() {
    const app = $("#app");
    if (!app) return;

    if (state.view === "session") {
      app.innerHTML = `
        ${renderHeader()}
        <main class="main session-main">${renderSession()}</main>
        <footer class="site-footer">Norðrœna · Classical Old Norse · scholarly labels · not Modern Icelandic</footer>`;
      bindSessionHandlers(app);
      return;
    }

    let main = "";
    if (state.view === "charter") main = renderCharter();
    else if (state.view === "futhark") main = renderFuthark();
    else if (state.view === "review") main = renderReview();
    else if (state.view === "notes") main = renderStudyNotes();
    else if (state.view === "lesson") main = renderClassicLesson();
    else main = renderPathHome();

    app.innerHTML = `
      ${renderHeader()}
      <main class="main">${main}</main>
      <footer class="site-footer">Norðrœna · Classical Old Norse path · ATTESTED / NORMALIZED / RECONSTRUCTED · not Modern Icelandic</footer>`;

    bindTts(app);
    bindMic(app);

    const reset = $("#reset-progress");
    if (reset) {
      reset.addEventListener("click", () => {
        if (confirm("Reset all path progress, XP, and streak?")) {
          NORDRONA.progress.resetAll();
          render();
        }
      });
    }

    if (state.view === "review") {
      const root = $("#review-root");
      if (root && NORDRONA.review) NORDRONA.review.renderQueue(root);
    }

    if (state.view === "lesson") {
      $$(".classic-check", app).forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-ex");
          const lesson = NORDRONA.lessons[1];
          const ex = (lesson.exercises || []).find((x) => x.id === id);
          const field = btn.closest("fieldset");
          const fb = field && $(".ex-feedback", field);
          if (!ex || !fb) return;
          let user = null;
          if (ex.type === "text") {
            const inp = field.querySelector(".classic-text");
            user = inp ? inp.value : "";
          } else {
            const picked = field.querySelector(`input[name="${id}"]:checked`);
            if (!picked) {
              fb.hidden = false;
              fb.className = "ex-feedback bad";
              fb.textContent = "Pick an answer.";
              return;
            }
            user = picked.value;
          }
          const result = NORDRONA.exercises.gradeWritten(ex, user);
          fb.hidden = false;
          fb.className = "ex-feedback " + (result.correct ? "ok" : "bad");
          fb.innerHTML = result.correct
            ? "Correct. " + (result.explanation || "")
            : "Not quite. " +
              (result.explanation || "") +
              (result.hint ? `<p class="hint">Hint: ${escapeHtml(result.hint)}</p>` : "");
        });
      });
    }

    if (state.view === "futhark") {
      $$(".futhark-check").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-ex");
          const q = (NORDRONA.futhark.quiz || []).find((x) => x.id === id);
          const field = btn.closest("fieldset");
          const picked = field && field.querySelector(`input[name="${id}"]:checked`);
          const fb = field && $(".ex-feedback", field);
          if (!q || !fb) return;
          if (!picked) {
            fb.hidden = false;
            fb.className = "ex-feedback bad";
            fb.textContent = "Pick an answer.";
            return;
          }
          const ok = picked.value === q.answer;
          fb.hidden = false;
          fb.className = "ex-feedback " + (ok ? "ok" : "bad");
          fb.innerHTML = ok
            ? "Correct. " + (q.explanation || "")
            : "Not quite. " + (q.explanation || "") + (q.hint ? `<p class="hint">Hint: ${q.hint}</p>` : "");
        });
      });
    }

    // Prevent locked node navigation
    $$(".path-node.locked").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
      });
    });
  }

  function bindSessionHandlers(app) {
    const S = NORDRONA.session;
    bindTts(app);
    bindMic(app);

    const quit = $(".sess-quit", app);
    if (quit) {
      quit.addEventListener("click", () => {
        S.abandon();
        state.sessionActive = false;
        navigate("home");
      });
    }

    const startEx = $(".sess-start-ex", app);
    if (startEx) {
      startEx.addEventListener("click", () => {
        S.markIntroDone();
        state.showIntro = false;
        render();
      });
    }

    // choice buttons
    $$(".choice-btn", app).forEach((btn) => {
      btn.addEventListener("click", () => {
        $$(".choice-btn", app).forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    // tiles
    $$(".tile-btn", app).forEach((btn) => {
      btn.addEventListener("click", () => {
        const out = $("[data-role='tile-out']", app);
        const val = btn.getAttribute("data-val");
        if (out) {
          out.textContent = val;
          out.setAttribute("data-val", val);
          out.classList.remove("muted");
        }
        $$(".tile-btn", app).forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    const checkBtn = $("#sess-check", app);
    const contBtn = $("#sess-continue", app);
    const feedback = $("#sess-feedback", app);
    const sessBody = $("#sess-exercise", app);

    function showContinue() {
      if (checkBtn) checkBtn.hidden = true;
      if (contBtn) contBtn.hidden = false;
    }

    if (checkBtn) {
      checkBtn.addEventListener("click", () => {
        const sess = S.getSession();
        const ex = S.currentExercise();
        if (!ex) return;

        // lore / speak: Check acts as continue-prep
        if (ex.type === "lore" || ex.type === "speak") {
          const result = S.check(app);
          if (feedback) {
            feedback.hidden = false;
            feedback.className = "sess-feedback ok";
            feedback.textContent =
              ex.type === "speak"
                ? "Checklist noted. Continue when ready."
                : "Continue when ready.";
          }
          showContinue();
          return;
        }

        const result = S.check(app);
        if (!result.ok && result.reason === "empty") {
          if (feedback) {
            feedback.hidden = false;
            feedback.className = "sess-feedback bad";
            feedback.textContent = "Select or type an answer first.";
          }
          return;
        }
        if (!result.ok) return;

        if (feedback) {
          feedback.hidden = false;
          feedback.className = "sess-feedback " + (result.correct ? "ok" : "bad");
          let msg = result.correct ? "Correct!" : "Not quite.";
          if (result.explanation) msg += " " + result.explanation;
          if (!result.correct && result.hint) msg += " Hint: " + result.hint;
          if (!result.correct && result.expected != null) {
            const exp =
              typeof result.expected === "object"
                ? JSON.stringify(result.expected)
                : String(result.expected);
            msg += " Expected: " + exp;
          }
          feedback.textContent = msg;
        }

        // update hearts display
        const heartsEl = $(".sess-hearts", app);
        if (heartsEl && sess) {
          heartsEl.textContent =
            "♥".repeat(sess.hearts) + "♡".repeat(Math.max(0, sess.heartsMax - sess.hearts));
        }

        if (result.dead) {
          showContinue();
          contBtn.textContent = "See result";
          return;
        }
        showContinue();
      });
    }

    if (contBtn) {
      contBtn.addEventListener("click", () => {
        const sess = S.getSession();
        if (sess && sess.hearts <= 0 && sess.checked && !sess.finished) {
          // fail out
          S.advance(); // may mark finished
          state.failed = true;
          state.sessionActive = false;
          S.abandon();
          render();
          return;
        }
        const adv = S.advance();
        if (adv.done) {
          if (adv.failed) {
            state.failed = true;
            state.sessionActive = false;
            render();
            return;
          }
          state.celebrate = adv;
          state.sessionActive = false;
          render();
          return;
        }
        state.showIntro = false;
        render();
      });
    }
  }

  function init() {
    parseHash();
    // #/lesson/1 → Classic Lesson 1 full view; #/lessons → path
    if (state.view === "lessons") {
      state.view = "home";
      location.hash = "#/home";
    }
    if (state.view === "lesson" && !state.levelId) {
      state.levelId = "1";
    }
    render();
    window.addEventListener("hashchange", () => {
      const prev = state.view;
      parseHash();
      if (state.view !== "session") {
        state.sessionActive = false;
        state.celebrate = null;
        state.failed = null;
        if (NORDRONA.session) NORDRONA.session.abandon();
      } else if (prev !== "session" || !state.sessionActive) {
        state.sessionActive = false;
        state.showIntro = true;
        state.celebrate = null;
        state.failed = null;
      }
      render();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();


  </script>
</body>
</html>
